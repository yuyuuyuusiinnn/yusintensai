<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポップ脳トレ！めくり記憶ゲーム</title>
    <!-- Tailwind CSS (デザイン用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=MURECHO:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome (アイコン用) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'MURECHO', sans-serif;
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            min-height: 100vh;
        }
        .font-pop {
            font-family: 'Fredoka One', cursive;
        }
        /* カードのアニメーション（3D Flip Effect） */
        .card-container {
            perspective: 1000px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s;
            transform-style: preserve-3d;
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .card-front {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            cursor: pointer;
            border: 3px solid #ffffff;
        }
        .card-front:hover {
            transform: scale(1.03);
            transition: transform 0.2s;
        }
        .card-back {
            background-color: #ffffff;
            transform: rotateY(180deg);
            border: 3px solid #FF8E53;
        }
        .card.matched .card-back {
            background-color: #E8F5E9;
            border-color: #4CAF50;
            animation: pulse 0.5s ease-in-out;
        }
        @keyframes pulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); }
            100% { transform: rotateY(180deg) scale(1); }
        }
    </style>
</head>
<body class="p-3 md:p-6 text-gray-800">

    <div class="max-w-4xl mx-auto bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-4 md:p-8 border-4 border-white">
        <!-- ヘッダーエリア -->
        <header class="flex flex-col md:flex-row justify-between items-center pb-6 border-b-2 border-pink-100 gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-3xl md:text-4xl font-black text-pink-500 tracking-wider flex items-center justify-center md:justify-start gap-2">
                    <i class="fa-solid fa-brain text-yellow-400 animate-bounce"></i> Pop! 記憶カードゲーム
                </h1>
                <p class="text-xs md:text-sm text-gray-500 font-bold mt-1">同じイラストを見つけてペアを作ろう！スコアは自動保存！</p>
            </div>

            <!-- ユーザー情報 & ログインボタン -->
            <div id="auth-section" class="flex items-center gap-3 bg-pink-50 p-3 rounded-2xl border border-pink-200">
                <div id="user-info" class="hidden flex items-center gap-3">
                    <img id="user-avatar" src="" alt="Avatar" class="w-10 h-10 rounded-full border-2 border-pink-400">
                    <div class="text-left">
                        <div id="user-name" class="font-bold text-sm text-gray-800 leading-tight"></div>
                        <button id="logout-btn" class="text-xs text-pink-600 hover:underline font-bold mt-1">ログアウト</button>
                    </div>
                </div>
                <button id="login-btn" class="bg-gradient-to-r from-red-500 to-pink-500 hover:from-red-600 hover:to-pink-600 text-white font-bold px-4 py-2.5 rounded-xl shadow-lg hover:shadow-xl transition flex items-center gap-2 text-sm">
                    <i class="fa-brands fa-google text-lg"></i> Googleでログイン
                </button>
            </div>
        </header>

        <!-- メインコンテンツ -->
        <main class="mt-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- ゲームメインエリア (2カラム分) -->
            <div class="lg:col-span-2 flex flex-col items-center">
                
                <!-- ログイン必須警告アナウンス -->
                <div id="login-notice" class="w-full bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-3 rounded-r-xl mb-4 text-xs font-bold flex items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation text-yellow-500 text-base"></i>
                    <span>ログインするとクリア記録が自動保存され、ランキングに登録されます！</span>
                </div>

                <!-- ステータスバー -->
                <div class="w-full bg-pink-100/80 rounded-2xl p-4 mb-6 flex justify-around items-center text-gray-700 shadow-inner">
                    <div class="text-center">
                        <span class="block text-xs font-bold text-gray-500 uppercase">経過時間</span>
                        <span id="timer" class="font-pop text-2xl md:text-3xl text-pink-600">0s</span>
                    </div>
                    <div class="h-8 w-0.5 bg-pink-200"></div>
                    <div class="text-center">
                        <span class="block text-xs font-bold text-gray-500 uppercase">めくった回数</span>
                        <span id="moves" class="font-pop text-2xl md:text-3xl text-purple-600">0</span>
                    </div>
                    <div class="h-8 w-0.5 bg-pink-200"></div>
                    <div class="text-center">
                        <span class="block text-xs font-bold text-gray-500 uppercase">マッチペア</span>
                        <span id="matches" class="font-pop text-2xl md:text-3xl text-emerald-600">0 / 6</span>
                    </div>
                </div>

                <!-- ゲーム盤面 (4x3 グリッド) -->
                <div id="game-board" class="grid grid-cols-3 sm:grid-cols-4 gap-3 w-full max-w-md aspect-[4/3] p-2 bg-pink-50/50 rounded-2xl border-2 border-pink-100">
                    <!-- JavaScriptで動的にカードを生成 -->
                </div>

                <!-- コントロールボタン -->
                <div class="mt-6 flex gap-4 w-full justify-center">
                    <button id="start-btn" class="w-full max-w-xs bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-black text-lg py-3 px-6 rounded-2xl shadow-lg transform active:scale-95 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-play"></i> ゲームスタート！
                    </button>
                </div>
            </div>

            <!-- サイドバー：記録・ランキング (1カラム分) -->
            <div class="flex flex-col gap-6">
                
                <!-- 自分の過去記録 -->
                <div class="bg-pink-50/60 p-5 rounded-2xl border border-pink-100 shadow-sm">
                    <h2 class="font-bold text-lg text-gray-800 flex items-center gap-2 mb-3">
                        <i class="fa-solid fa-user-check text-pink-500"></i> あなたのベスト記録
                    </h2>
                    <div id="my-best-score" class="text-center p-3 bg-white rounded-xl shadow-inner border border-pink-100">
                        <p class="text-xs text-gray-400 font-bold">ログインするとベストスコアが表示されます</p>
                    </div>
                </div>

                <!-- 全体ランキング -->
                <div class="bg-amber-50/60 p-5 rounded-2xl border border-amber-100 shadow-sm flex-1">
                    <h2 class="font-bold text-lg text-gray-800 flex items-center gap-2 mb-3">
                        <i class="fa-solid fa-trophy text-amber-500"></i> ハイスコアランキング
                    </h2>
                    <div id="ranking-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                        <p class="text-xs text-gray-400 text-center py-4">読み込み中...</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- クリア時モーダルダイアログ -->
    <div id="clear-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full text-center shadow-2xl border-4 border-yellow-300 transform animate-bounce-short">
            <div class="text-6xl mb-2">🎉</div>
            <h2 class="text-2xl font-black text-pink-500 mb-1">ステージクリア！</h2>
            <p class="text-xs text-gray-500 font-bold mb-4">素晴らしい記憶力です！</p>
            
            <div class="bg-pink-50 rounded-2xl p-4 mb-4 text-left space-y-2 text-sm font-bold text-gray-700">
                <div class="flex justify-between">
                    <span>クリアタイム:</span>
                    <span id="modal-time" class="text-pink-600 font-pop">0秒</span>
                </div>
                <div class="flex justify-between">
                    <span>めくった回数:</span>
                    <span id="modal-moves" class="text-purple-600 font-pop">0回</span>
                </div>
                <div class="flex justify-between border-t border-pink-200 pt-2 text-base">
                    <span>総合スコア:</span>
                    <span id="modal-score" class="text-emerald-600 font-pop text-lg">0 pt</span>
                </div>
            </div>

            <p id="save-status-msg" class="text-xs text-gray-400 mb-4 font-bold"></p>

            <button id="modal-close-btn" class="w-full bg-gradient-to-r from-pink-500 to-red-500 text-white font-bold py-3 rounded-xl shadow-md hover:shadow-lg transition">
                もう一度遊ぶ！
            </button>
        </div>
    </div>

    <!-- Firebase SDK Imports (v11) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 1. Firebase設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyA8wvf2oEqIT6EgjVL55x_epHm02CBXS9U",
            authDomain: "game-130a7.firebaseapp.com",
            projectId: "game-130a7",
            storageBucket: "game-130a7.firebasestorage.app",
            messagingSenderId: "761413083538",
            appId: "1:761413083538:web:3bc3d7d7169d5a636da14b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // アプリID定義 (Firestore必須ルール対応)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'memory-game';

        // --- 2. 状態管理 ---
        let currentUser = null;
        let gameCards = [];
        let flippedCards = [];
        let matchedCount = 0;
        let moveCount = 0;
        let timerInterval = null;
        let secondsElapsed = 0;
        let isGameStarted = false;
        let canFlip = true;

        // カード用絵柄アイコン (6ペア = 12枚)
        const EMOJIS = ['🍎', '🍌', '🍓', '🍇', '🐶', '🐱'];

        // --- 3. DOM要素取得 ---
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const userInfo = document.getElementById('user-info');
        const userName = document.getElementById('user-name');
        const userAvatar = document.getElementById('user-avatar');
        const loginNotice = document.getElementById('login-notice');

        const gameBoard = document.getElementById('game-board');
        const startBtn = document.getElementById('start-btn');
        const timerDisplay = document.getElementById('timer');
        const movesDisplay = document.getElementById('moves');
        const matchesDisplay = document.getElementById('matches');

        const myBestScoreContainer = document.getElementById('my-best-score');
        const rankingListContainer = document.getElementById('ranking-list');

        const clearModal = document.getElementById('clear-modal');
        const modalTime = document.getElementById('modal-time');
        const modalMoves = document.getElementById('modal-moves');
        const modalScore = document.getElementById('modal-score');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        const saveStatusMsg = document.getElementById('save-status-msg');

        // --- 4. 認証機能 (Firebase Auth) ---
        
        // ログイン
        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("ログインエラー:", error);
                alert("ログインに失敗しました: " + error.message);
            }
        });

        // ログアウト
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("ログアウトエラー:", error);
            }
        });

        // 認証状態の監視
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                // ログイン時
                userName.textContent = user.displayName || "ゲスト";
                userAvatar.src = user.photoURL || "https://placehold.co/100x100?text=User";
                userInfo.classList.remove('hidden');
                loginBtn.classList.add('hidden');
                loginNotice.classList.add('hidden');
                
                // 個人スコア取得
                loadMyBestScore(user.uid);
            } else {
                // 未ログイン時
                userInfo.classList.add('hidden');
                loginBtn.classList.remove('hidden');
                loginNotice.classList.remove('hidden');
                myBestScoreContainer.innerHTML = `<p class="text-xs text-gray-400 font-bold py-2">ログインするとベストスコアが表示されます</p>`;
            }
        });

        // --- 5. データベース機能 (Firestore) ---

        // 個人スコア保存 (ルールに沿ったパス: /artifacts/{appId}/users/{userId}/scores)
        async function saveScore(scoreData) {
            if (!currentUser) return false;

            try {
                // 個人用スコア記録
                const userScoreRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'scores', 'best');
                
                // パブリックランキング用記録 (/artifacts/{appId}/public/data/leaderboard)
                const publicLeaderboardRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', currentUser.uid);

                const dataToSave = {
                    uid: currentUser.uid,
                    userName: currentUser.displayName || "名無し",
                    userPhoto: currentUser.photoURL || "",
                    score: scoreData.score,
                    time: scoreData.time,
                    moves: scoreData.moves,
                    updatedAt: serverTimestamp()
                };

                await setDoc(userScoreRef, dataToSave, { merge: true });
                await setDoc(publicLeaderboardRef, dataToSave, { merge: true });

                // UI更新
                loadMyBestScore(currentUser.uid);
                return true;
            } catch (error) {
                console.error("スコア保存失敗:", error);
                return false;
            }
        }

        // 自分のベストスコア読み込み
        function loadMyBestScore(userId) {
            if (!userId) return;

            const userScoreRef = collection(db, 'artifacts', appId, 'users', userId, 'scores');
            onSnapshot(userScoreRef, (snapshot) => {
                let bestScore = null;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (!bestScore || data.score > bestScore.score) {
                        bestScore = data;
                    }
                });

                if (bestScore) {
                    myBestScoreContainer.innerHTML = `
                        <div class="text-pink-600 font-pop text-2xl">${bestScore.score} <span class="text-xs font-sans text-gray-500">pt</span></div>
                        <div class="text-xs text-gray-500 mt-1 font-bold">
                            タイム: ${bestScore.time}秒 / 手数: ${bestScore.moves}回
                        </div>
                    `;
                } else {
                    myBestScoreContainer.innerHTML = `<p class="text-xs text-gray-400 font-bold py-2">まだプレイ記録がありません</p>`;
                }
            }, (error) => {
                console.error("スコア読み込みエラー:", error);
            });
        }

        // 全体ランキング読み込み (複合クエリ回避のためメモリソートを実施)
        function loadGlobalRanking() {
            const leaderboardRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
            
            onSnapshot(leaderboardRef, (snapshot) => {
                let list = [];
                snapshot.forEach(doc => {
                    list.push(doc.data());
                });

                // JavaScriptメモリ内でハイスコア順にソート (RULE 2準拠)
                list.sort((a, b) => (b.score || 0) - (a.score || 0));

                if (list.length === 0) {
                    rankingListContainer.innerHTML = `<p class="text-xs text-gray-400 text-center py-4 font-bold">ランキングデータがありません</p>`;
                    return;
                }

                rankingListContainer.innerHTML = list.slice(0, 5).map((item, index) => {
                    const crownColor = index === 0 ? 'text-yellow-400' : index === 1 ? 'text-gray-400' : index === 2 ? 'text-amber-600' : 'text-gray-300';
                    return `
                        <div class="flex items-center justify-between bg-white p-2.5 rounded-xl border border-amber-100 shadow-sm text-xs font-bold">
                            <div class="flex items-center gap-2 overflow-hidden">
                                <span class="font-pop text-sm ${crownColor} w-4 text-center">#${index + 1}</span>
                                <img src="${item.userPhoto || 'https://placehold.co/50x50?text=U'}" class="w-6 h-6 rounded-full border">
                                <span class="truncate text-gray-700 max-w-[80px]">${item.userName}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-pink-600 font-pop text-sm">${item.score}</span> <span class="text-[10px] text-gray-400">pt</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }, (error) => {
                console.error("ランキング読み込みエラー:", error);
                rankingListContainer.innerHTML = `<p class="text-xs text-red-400 text-center py-4">読み込みエラー</p>`;
            });
        }

        // --- 6. ゲームロジック ---

        // 初期化 & ボード構築
        function initBoard() {
            // 絵柄をペアにしてシャッフル
            const deck = [...EMOJIS, ...EMOJIS].sort(() => Math.random() - 0.5);
            gameBoard.innerHTML = '';
            gameCards = [];

            deck.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.className = 'card card-container h-full w-full';
                card.dataset.index = index;
                card.dataset.emoji = emoji;

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            <i class="fa-solid fa-question text-xl"></i>
                        </div>
                        <div class="card-back text-3xl select-none">
                            ${emoji}
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => handleCardClick(card));
                gameBoard.appendChild(card);
                gameCards.push(card);
            });
        }

        // カードクリック処理
        function handleCardClick(card) {
            if (!isGameStarted || !canFlip) return;
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moveCount++;
                movesDisplay.textContent = moveCount;
                checkMatch();
            }
        }

        // マッチチェック
        function checkMatch() {
            canFlip = false;
            const [card1, card2] = flippedCards;

            if (card1.dataset.emoji === card2.dataset.emoji) {
                // 一致
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedCount++;
                    matchesDisplay.textContent = `${matchedCount} / 6`;
                    flippedCards = [];
                    canFlip = true;

                    // 全て揃ったらクリア
                    if (matchedCount === 6) {
                        finishGame();
                    }
                }, 300);
            } else {
                // 不一致（裏に戻す）
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    canFlip = true;
                }, 900);
            }
        }

        // ゲーム開始
        function startGame() {
            // タイマーリセット
            clearInterval(timerInterval);
            secondsElapsed = 0;
            moveCount = 0;
            matchedCount = 0;
            flippedCards = [];
            canFlip = true;
            isGameStarted = true;

            timerDisplay.textContent = '0s';
            movesDisplay.textContent = '0';
            matchesDisplay.textContent = '0 / 6';

            initBoard();

            // タイマー起動
            timerInterval = setInterval(() => {
                secondsElapsed++;
                timerDisplay.textContent = `${secondsElapsed}s`;
            }, 1000);

            startBtn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> やり直す`;
            startBtn.className = startBtn.className.replace('from-emerald-400 to-teal-500', 'from-amber-400 to-orange-500');
        }

        // ゲーム終了（クリア）
        async function finishGame() {
            clearInterval(timerInterval);
            isGameStarted = false;

            // スコア計算: (基点1000点) - (時間 x 10) - (手数 x 20) ※最低100点保証
            const calculatedScore = Math.max(100, 1000 - (secondsElapsed * 10) - (moveCount * 20));

            modalTime.textContent = `${secondsElapsed}秒`;
            modalMoves.textContent = `${moveCount}回`;
            modalScore.textContent = `${calculatedScore} pt`;

            if (currentUser) {
                saveStatusMsg.textContent = "クラウドにスコアを保存中...";
                const success = await saveScore({
                    score: calculatedScore,
                    time: secondsElapsed,
                    moves: moveCount
                });
                saveStatusMsg.textContent = success ? "✅ クラウドにスコアを保存しました！" : "⚠️ スコア保存に失敗しました。";
            } else {
                saveStatusMsg.textContent = "💡 ログインするとランキングに登録されます！";
            }

            clearModal.classList.remove('hidden');
        }

        // --- 7. イベントリスナー ---
        startBtn.addEventListener('click', startGame);

        modalCloseBtn.addEventListener('click', () => {
            clearModal.classList.add('hidden');
            startGame();
        });

        // 起動処理
        initBoard();
        loadGlobalRanking();

    </script>
</body>
</html>
